<!DOCTYPE html>
<html lang="vi"
      data-theme="{{ ui_prefs.theme }}"
      data-font="{{ ui_prefs.font_size }}"
      data-avatars="{{ '1' if ui_prefs.show_avatars else '0' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyServer{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><path d='M22 32h56v30H44L30 74V62h-8z' fill='white'/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
