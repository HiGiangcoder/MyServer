{% extends "base.html" %}
{% block title %}Chat — MyServer{% endblock %}
{% block body_class %}chat-page{% endblock %}

{% block body %}
<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <div class="logo">💬 <span>MyServer</span></div>
            <button type="button" class="icon-btn mobile-only" id="close-sidebar" aria-label="Đóng">✕</button>
        </div>

        <button type="button" class="conv active" id="room-btn">
            <span class="hash">#</span>
            <span class="conv-name">Phòng chung</span>
        </button>

        <div class="side-title">Thành viên <span id="online-count">0</span></div>
        <div class="user-list" id="user-list"></div>

        <div class="sidebar-foot">
            <div class="avatar" id="me-avatar"></div>
            <div class="me-info">
                <strong id="me-name"></strong>
                <span id="me-handle"></span>
                <span class="admin-badge" id="me-badge" hidden>Admin</span>
            </div>
            <a href="{{ url_for('settings_page') }}" class="icon-btn" title="Cài đặt" aria-label="Cài đặt">⚙</a>
            <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf }}">
                <button type="submit" class="icon-btn" title="Đăng xuất" aria-label="Đăng xuất">⏻</button>
            </form>
        </div>
    </aside>

    <main class="chat">
        <header class="chat-head">
            <button type="button" class="icon-btn mobile-only" id="open-sidebar" aria-label="Mở danh sách">☰</button>
            <div>
                <h2 id="conv-title"># Phòng chung</h2>
                <span class="muted" id="conv-sub">Mọi người trong server</span>
            </div>
            <span class="status" id="conn-status" title="Đã kết nối">●</span>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <form class="composer" id="composer">
            <div class="composer-tools">
                <button type="button" class="tool-btn" id="emoji-btn" title="Biểu cảm" aria-label="Biểu cảm">😊</button>
                <button type="button" class="tool-btn" id="file-btn" title="Gửi tệp" aria-label="Gửi tệp">📎</button>
                <button type="button" class="tool-btn" id="folder-btn" title="Gửi cả thư mục" aria-label="Gửi thư mục">📁</button>
                <input type="file" id="file-input" multiple hidden>
                <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
                <span class="upload-hint" id="upload-hint"></span>
            </div>

            <div class="composer-row">
                <textarea id="input" rows="1" maxlength="2000"
                          placeholder="Nhập tin nhắn… (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
                <button type="submit" class="btn-primary" id="send">Gửi</button>
            </div>

            <div id="emoji-picker" class="emoji-picker" hidden></div>
            <div id="selected-files" class="selected-files" hidden></div>
            <div id="progress" class="upload-progress" hidden>
                <div class="upload-progress-bar" id="progress-bar"></div>
            </div>
        </form>
    </main>
</div>

<script>
    window.APP = {{ {
        "me": {
            "id": me["id"],
            "username": me["username"],
            "display_name": me["display_name"],
            "is_admin": me["is_admin"] == 1,
        },
        "csrf": csrf,
        "settings": ui_prefs,
        "config": upload_cfg,
    } | tojson }};
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
